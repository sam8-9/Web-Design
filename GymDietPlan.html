<!DOCTYPE html>
<html>
<head>
    <title>Gym Diet Plan</title>
</head>
<body>

<table border="1" cellpadding="10">

    <caption><b>Gym Diet Plan</b></caption>

    <!-- Main Heading -->
    <tr>
        <th colspan="4">Weekly Diet Schedule</th>
    </tr>

    <!-- Table Heading -->
    <tr>
        <th rowspan="2">Time</th>
        <th colspan="3">Meals</th>
    </tr>

    <tr>
        <th>Monday</th>
        <th>Tuesday</th>
        <th>Wednesday</th>
    </tr>

    <!-- Breakfast -->
    <tr>
        <td>8:00 AM</td>
        <td>Oats & Milk</td>
        <td>Poha</td>
        <td>Boiled Eggs</td>
    </tr>

    <!-- Lunch -->
    <tr>
        <td>1:00 PM</td>
        <td>Rice & Dal</td>
        <td>Chapati & Paneer</td>
        <td>Chicken & Rice</td>
    </tr>

    <!-- Evening Snack -->
    <tr>
        <td>5:00 PM</td>
        <td colspan="3" align="center">
            Banana + Peanut Butter + Protein Shake
        </td>
    </tr>

    <!-- Dinner -->
    <tr>
        <td>8:30 PM</td>
        <td>Salad</td>
        <td>Paneer</td>
        <td>Fish & Vegetables</td>
    </tr>

</table>

</body>
</html>
