<!DOCTYPE html>
<html>
<head>
    <title>HTML Lists</title>
</head>
<body>

<h2>Ordered List</h2>

<ol type="A">
    <li>Java</li>
    <li>Python</li>
    <li>HTML</li>
</ol>

<hr>

<h2>Unordered List</h2>

<ul type="square">
    <li>Apple</li>
    <li>Mango</li>
    <li>Orange</li>
</ul>

<hr>

<h2>Description List</h2>

<dl>
    <dt>HTML</dt>
    <dd>HyperText Markup Language</dd>

    <dt>CSS</dt>
    <dd>Cascading Style Sheets</dd>
</dl>

<hr>

<h2>Nested List</h2>

<ol>
    <li>Frontend
        <ul>
            <li>HTML</li>
            <li>CSS</li>
        </ul>
    </li>

    <li>Backend
        <ul>
            <li>Java</li>
            <li>Python</li>
        </ul>
    </li>
</ol>

</body>
</html>
